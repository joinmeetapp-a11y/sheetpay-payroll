name: Validate Sheetpay Accountant Convex backend

on:
  push:
    branches:
      - main
    paths:
      - 'convex/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/convex-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'convex/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/convex-deploy.yml'
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test private bulk payslip email delivery
        run: npm run test:bulk

      - name: Verify Accountant pricing and usage enforcement
        run: npm run test:pricing && npx tsc --noEmit --project tsconfig.pricing.json

      - name: Verify private LinkedIn generation and publishing safeguards
        run: npm run test:social

      - name: Build the backend project UI
        run: npm run build:frontend


