name: Validate Sheetpay Accountant Convex backend

on:
  push:
    branches:
      - main
    paths:
      - 'convex/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/convex-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'convex/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/convex-deploy.yml'
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the backend project UI
        run: npm run build:frontend

      - name: Deploy production Convex functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
