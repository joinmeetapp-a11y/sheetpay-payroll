name: Validate Sheetpay Accountant Convex backend

on:
  push:
    branches:
      - main
    paths:
      - 'convex/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/convex-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'convex/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/convex-deploy.yml'
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check Convex backend
        run: npm run lint
