name: Verify practice plan limits
on:
  push:
    branches: [feat/practice-plan-limits-20261118]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:convex
      - run: npx vitest run
      - run: npm run check:social-bundle
