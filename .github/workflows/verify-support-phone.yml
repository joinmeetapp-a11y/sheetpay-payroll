name: Verify Mia support phone
on:
  push:
    branches: [feat/accountant-support-phone-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:convex
      - run: npx vitest run tests/mia.test.ts
