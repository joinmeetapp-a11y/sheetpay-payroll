name: Build Android APK

on:
  push:
    branches:
      - claude/capacitor-android
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - generate_keystore

permissions:
  contents: write

jobs:
  # One-shot keystore generator. Prints SHA-1/SHA-256 fingerprints for
  # Firebase Console + the base64 blob to paste into ANDROID_KEYSTORE_BASE64.
  # Trigger manually: Run workflow → mode: generate_keystore.
  generate-keystore:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'generate_keystore'
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate keystore & print fingerprints
        run: |
          set -e
          KEYSTORE_PASSWORD=$(openssl rand -base64 24 | tr -d '=+/' | cut -c1-24)
          KEY_PASSWORD=$(openssl rand -base64 24 | tr -d '=+/' | cut -c1-24)
          KEY_ALIAS='sheetpay-release'

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname 'CN=Sheetpay, O=Sheetpay, C=TT'

          FINGERPRINTS=$(keytool -list -v -keystore release.keystore -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E 'SHA1|SHA-?256')

          # Print to job log AND to summary so the values can be recovered
          # from either place.
          echo '::group::Fingerprints (register in Firebase Console)'
          echo "$FINGERPRINTS"
          echo '::endgroup::'
          echo '::group::Secrets to add (Settings → Secrets and variables → Actions)'
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          echo '::endgroup::'

          {
            echo '## Fingerprints (register these in Firebase Console)'
            echo ''
            echo '```'
            echo "$FINGERPRINTS"
            echo '```'
            echo ''
            echo '## Add these 4 repo secrets (Settings → Secrets and variables → Actions)'
            echo ''
            echo "- \`ANDROID_KEYSTORE_PASSWORD\` — \`$KEYSTORE_PASSWORD\`"
            echo "- \`ANDROID_KEY_ALIAS\` — \`$KEY_ALIAS\`"
            echo "- \`ANDROID_KEY_PASSWORD\` — \`$KEY_PASSWORD\`"
            echo '- `ANDROID_KEYSTORE_BASE64` — the long base64 line printed in the *Encoded keystore* step below'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encoded keystore (copy to ANDROID_KEYSTORE_BASE64 secret)
        run: |
          echo '::group::ANDROID_KEYSTORE_BASE64 (single line, copy verbatim)'
          base64 -w 0 release.keystore
          echo ''
          echo '::endgroup::'

      - name: Wipe local copy
        if: always()
        run: rm -f release.keystore

  build-apk:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'generate_keystore'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        env:
          # Bake production Convex + Firebase config into the APK. Web already
          # reads these from the same env at build time — we reuse them so a
          # user's sheetpay.app account and Android app talk to identical
          # Convex + Firebase projects.
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build:frontend

      - name: Fail early if Firebase Android config is missing
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo '::error::GOOGLE_SERVICES_JSON repo secret is not set. Register the Android app in the Firebase Console (package app.mysheetpay.mobile), download google-services.json, and add its base64 contents as the GOOGLE_SERVICES_JSON secret.'
            exit 1
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Generate launcher icons from public/icon.svg
        if: hashFiles('public/icon.svg') != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 public/icon.svg -o assets/icon-foreground.png
          cp assets/icon-foreground.png assets/icon.png
          python3 -c "from PIL import Image; Image.new('RGB',(1024,1024),(15,23,42)).save('assets/icon-background.png')"
          npx @capacitor/assets generate --android --assetPath assets

      - name: Write google-services.json into android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Accept either raw JSON or base64-encoded JSON in the secret.
          if echo "$GOOGLE_SERVICES_JSON" | head -c 1 | grep -q '{'; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          fi
          # Sanity: it must be JSON containing our appId.
          node -e "const j=require('./android/app/google-services.json'); const ok=(j.client||[]).some(c=>c.client_info.android_client_info.package_name==='app.mysheetpay.mobile'); if(!ok){console.error('google-services.json does not list package app.mysheetpay.mobile'); process.exit(1);}"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # ── Signed release build (when keystore secrets are present) ──────────
      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "have_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wire release signing config into build.gradle
        if: steps.keystore.outputs.have_keystore == 'true'
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          gradle = p.read_text()
          signing = """
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      // PKCS12 keystores force the key password to equal the
                      // store password; the generator's -keypass is ignored.
                      // Use the store password here so Gradle can unlock the
                      // key without hitting BadPaddingException.
                      keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                  }
              }
          """
          if 'signingConfigs' not in gradle:
              gradle = gradle.replace('android {', 'android {\n' + signing, 1)
          # Point buildTypes.release at our signingConfig.
          gradle = gradle.replace(
              'buildTypes {\n        release {',
              "buildTypes {\n        release {\n            signingConfig signingConfigs.release",
              1,
          )
          p.write_text(gradle)
          PY

      - name: Build release APK
        if: steps.keystore.outputs.have_keystore == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK (fallback when no release keystore is set)
        if: steps.keystore.outputs.have_keystore != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        id: collect
        run: |
          mkdir -p artifacts
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk artifacts/sheetpay-release-${{ github.run_number }}.apk
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/sheetpay-debug-${{ github.run_number }}.apk
            echo "kind=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheetpay-android-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Sheetpay Android build #${{ github.run_number }} (${{ steps.collect.outputs.kind }})
          body: |
            APK built from `${{ github.ref_name }}` @ `${{ github.sha }}`.
            Build type: **${{ steps.collect.outputs.kind }}**.

            **Install on Android:**
            1. Open this release on your phone (Chrome, signed into GitHub).
            2. Tap the `.apk` below to download.
            3. Chrome will prompt to "Install unknown apps" — allow once.
            4. Open the downloaded file and tap Install.

            Authenticates against the shared Firebase (`mysheetpay`) and
            Convex (`sheetpay-agent`) so signing in surfaces the same
            businesses, employees, payroll and subscription as sheetpay.app.
          files: artifacts/*.apk
          draft: false
          prerelease: ${{ steps.collect.outputs.kind == 'debug' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
