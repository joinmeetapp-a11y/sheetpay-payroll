name: Deploy Sheetpay Accountant to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/firebase-hosting-merge.yml'

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npm run build:frontend
        env:
          VITE_CONVEX_URL: https://glad-bat-528.convex.cloud
          VITE_PADDLE_CLIENT_TOKEN: live_22e84513c875d91d7a5560cd68e

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYSHEETPAY }}
          channelId: live
          projectId: mysheetpay
