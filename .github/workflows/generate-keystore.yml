name: Generate Release Keystore (run once)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias (letters/digits/underscores only)'
        required: true
        default: 'sheetpay-release'
      key_dname:
        description: 'Distinguished name for the certificate'
        required: true
        default: 'CN=Sheetpay, O=Sheetpay, C=TT'
      validity_years:
        description: 'Certificate validity in years'
        required: true
        default: '30'

# Manual-only. Produces a keystore + fingerprints so you can populate repo
# secrets and register the SHA-1/SHA-256 in the Firebase Console. Never
# commits anything; every artifact stays inside the workflow log.
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          set -e
          KEYSTORE_PASSWORD=$(openssl rand -base64 24 | tr -d '=+/' | cut -c1-24)
          KEY_PASSWORD=$(openssl rand -base64 24 | tr -d '=+/' | cut -c1-24)
          KEY_ALIAS='${{ github.event.inputs.key_alias }}'
          VALIDITY_DAYS=$(( ${{ github.event.inputs.validity_years }} * 365 ))

          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$VALIDITY_DAYS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname '${{ github.event.inputs.key_dname }}'

          echo '## Fingerprints (register these in Firebase Console)' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          keytool -list -v \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -E 'SHA1|SHA-?256' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo '' >> $GITHUB_STEP_SUMMARY
          echo '## Add these repo secrets' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Go to Settings → Secrets and variables → Actions → New repository secret and add:' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '- `ANDROID_KEYSTORE_BASE64` — the base64 blob printed in the *Encoded keystore* step below' >> $GITHUB_STEP_SUMMARY
          echo "- \`ANDROID_KEYSTORE_PASSWORD\` — \`$KEYSTORE_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ANDROID_KEY_ALIAS\` — \`$KEY_ALIAS\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ANDROID_KEY_PASSWORD\` — \`$KEY_PASSWORD\`" >> $GITHUB_STEP_SUMMARY

      - name: Encoded keystore (copy to ANDROID_KEYSTORE_BASE64 secret)
        run: |
          echo '::group::ANDROID_KEYSTORE_BASE64 (single line, copy verbatim)'
          base64 -w 0 release.keystore
          echo ''
          echo '::endgroup::'

      - name: Wipe local copy
        if: always()
        run: rm -f release.keystore
